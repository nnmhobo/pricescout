name: Notify customer on main update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip main branch
        run: git archive --format=zip -o PriceScout.zip HEAD

      - name: Create release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: PriceScout.zip

      - name: Email customer with download link
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.zoho.eu
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "PriceScout: нова версія 🎉"
          to: ${{ secrets.CUSTOMER_EMAIL }}
          from: "PriceScout Team <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Доброго дня!

            Раді повідомити — вийшла нова версія PriceScout!
            Завантажити оновлення можна за посиланням нижче (увійдіть в свій GitHub-акаунт).

            Посилання: ${{ fromJSON(steps.release.outputs.assets)[0].browser_download_url }}

            З повагою,
            Команда PriceScout